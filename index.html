  <script>
    // Which side the Dynamic Island is on in landscape: the top of the phone turned left (90) or right (270).
    (function () {
      function island() {
        var a = screen.orientation ? screen.orientation.angle : window.orientation;
        a = ((a % 360) + 360) % 360;
        document.documentElement.dataset.island = a === 90 ? 'left' : a === 270 ? 'right' : 'none';
      }
      island();
      if (screen.orientation) screen.orientation.addEventListener('change', island);
      else window.addEventListener('orientationchange', island);
    })();
  </script>

    <script>
      function includeHTML() {
      var z, i, elmnt, file, xhttp;
      /*loop through a collection of all HTML elements:*/
      z = document.getElementsByTagName("*");
      for (i = 0; i < z.length; i++) {
        elmnt = z[i];
        /*search for elements with a certain atrribute:*/
        file = elmnt.getAttribute("w3-include-html");

        // var url = window.location.pathname;


        if (file) {
          // console.log();

          // console.log(file);
          var path = window.location.pathname.replace(  window.location.pathname.split('/').slice(-1), "");
          var m_file = path + file.replace("/","");
          file = m_file;


          /*make an HTTP request using the attribute value as the file name:*/
          xhttp = new XMLHttpRequest();
          xhttp.onreadystatechange = function() {
            if (this.readyState == 4) {
              if (this.status == 200) {elmnt.innerHTML = this.responseText;}
              if (this.status == 404) {elmnt.innerHTML = "Page not found.";}
              /*remove the attribute, and call this function once more:*/
              elmnt.removeAttribute("w3-include-html");
              includeHTML();
            }
          }
          xhttp.open("GET", file, true);
          xhttp.send();
          /*exit the function:*/
          return;
        }
      }
    }
    </script>

    <script>
      includeHTML();
    </script>
