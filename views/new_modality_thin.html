<!-- new-modality: seen through a full-height gap in the page (css/redaction-project-globe.css).
     The redaction project globe is drawn by js/redaction-project-globe.js. -->
<div class="redaction_stage">
  <canvas class="redaction_canvas" aria-hidden="true"></canvas>
  <!-- for browsers that can't draw the globe; not downloaded unless shown -->
  <img class="redaction_fallback" src="./assets/new_modality/redaction-project-globe.png" alt="" loading="lazy">
  <!-- the line, written in as the globe hears it: pictures of it, filled in by the script -->
  <p class="redaction_caption" aria-hidden="true"></p>
  <h2 class="visually-hidden">new-modality</h2>
  <p class="visually-hidden">The mouse and keyboard are dead. Long live new-modality.</p>
</div>
